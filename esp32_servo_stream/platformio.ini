; PlatformIO 配置 — ESP32-C3-DevKitM-1 + PCA9685 舵机流驱动
; 用法: cd esp32_servo_stream && pio run -t upload && pio device monitor
;
; 注意: 官方 platformio/espressif32 平台 (v7.1.3) 还在用 Arduino core 2.0.17;
; 本配置用 pioarduino 平台获得 core 3.3.x (server.accept() 等 3.x API)。
; 如果改用官方平台 (platform = espressif32)，把 sketch 里的 server.accept()
; 改回 server.available() 即可（3.x 中 available() 仍可用但已弃用）。

[platformio]
src_dir = .

[env:esp32-c3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^2.4.0
    adafruit/Adafruit BusIO

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0     ; DevKitM-1 板载 USB-UART 桥，Serial → UART0
